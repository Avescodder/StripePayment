<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.name }} - Купить</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .price {
            font-size: 3em;
            font-weight: 700;
            color: #667eea;
            margin: 20px 0;
            text-align: center;
        }
        
        .currency {
            font-size: 0.5em;
            color: #888;
            text-transform: uppercase;
        }
        
        .description {
            color: #555;
            line-height: 1.8;
            margin: 30px 0;
            font-size: 1.1em;
        }
        
        .buy-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .buy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .buy-button:active {
            transform: translateY(0);
        }
        
        .buy-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #764ba2;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ item.name }}</h1>
        </div>
        
        <div class="content">
            <div class="price">
                {{ item.get_display_price }} <span class="currency">{{ item.currency }}</span>
            </div>
            
            <div class="description">
                {{ item.description }}
            </div>
            
            <button id="buy-button" class="buy-button">
                💳 Купить сейчас
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Перенаправление на оплату...</p>
            </div>
            
            <div class="error" id="error"></div>
            
            <a href="/" class="back-link">← Вернуться к списку товаров</a>
        </div>
    </div>

    <script>
        var stripe = Stripe('{{ stripe_publishable_key }}');
        var buyButton = document.getElementById('buy-button');
        var loading = document.getElementById('loading');
        var errorDiv = document.getElementById('error');
        
        buyButton.addEventListener('click', function() {
            buyButton.disabled = true;
            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            
            fetch('/buy/{{ item.id }}/', {
                method: 'GET',
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(session) {
                if (session.error) {
                    throw new Error(session.error);
                }
                return stripe.redirectToCheckout({ sessionId: session.id });
            })
            .then(function(result) {
                if (result.error) {
                    throw new Error(result.error.message);
                }
            })
            .catch(function(error) {
                console.error('Error:', error);
                errorDiv.textContent = 'Ошибка: ' + error.message;
                errorDiv.style.display = 'block';
                buyButton.disabled = false;
                loading.style.display = 'none';
            });
        });
    </script>
</body>
</html>
